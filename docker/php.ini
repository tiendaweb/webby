; PHP Configuration for Webby
; This file is included after the default PHP configuration

; Load environment variables from .env file before application bootstrap
auto_prepend_file = /var/www/html/docker/bootstrap.php

; Display errors during development
display_errors = Off
display_startup_errors = Off

; Set error reporting
error_reporting = E_ALL

; Log errors
log_errors = On
error_log = /var/log/php-error.log

; Disable dangerous functions (but allow proc_open and curl which are needed by Laravel)
disable_functions = exec,passthru,shell_exec,system,popen,parse_ini_file,show_source

; Memory and execution limits
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
post_max_size = 100M
upload_max_filesize = 100M

; Session settings
session.save_path = /var/www/html/storage/sessions
