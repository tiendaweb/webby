[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",APP_KEY="%(ENV_APP_KEY)s"

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=999
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm.err
user=root
environment=APP_KEY="%(ENV_APP_KEY)s"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=998
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err
user=root

[program:queue]
command=php /var/www/html/artisan queue:listen --sleep=3 --tries=3
autostart=true
autorestart=true
numprocs=1
priority=997
stdout_logfile=/var/log/supervisor/queue.log
stderr_logfile=/var/log/supervisor/queue.err
user=www-data

[program:scheduler]
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run; sleep 60; done"
autostart=true
autorestart=true
priority=996
stdout_logfile=/var/log/supervisor/scheduler.log
stderr_logfile=/var/log/supervisor/scheduler.err
user=www-data

[program:reverb]
command=php /var/www/html/artisan reverb:start --port=8892
autostart=false
autorestart=true
priority=995
stdout_logfile=/var/log/supervisor/reverb.log
stderr_logfile=/var/log/supervisor/reverb.err
user=www-data
stopwaitsecs=30

[program:builder]
command=/var/www/html/Builder/prebuilt/webby-builder-linux
autostart=false
autorestart=false
priority=994
stdout_logfile=/var/log/supervisor/builder.log
stderr_logfile=/var/log/supervisor/builder.err
user=www-data
stopwaitsecs=30
