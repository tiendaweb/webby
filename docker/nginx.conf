server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/html/public;
    index index.php index.html;
    client_max_body_size 20m;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # PHP execution
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Buffer configuration for large headers
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_max_temp_file_size 0;
        fastcgi_read_timeout 300s;
    }

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # /.well-known/ must reach Laravel even though it starts with a dot:
    # it is where the OAuth discovery documents live, and an MCP client that
    # cannot fetch them cannot authenticate at all. "^~" beats the regex
    # dot-file rule below, which would otherwise 403 the whole directory.
    # ACME http-01 challenges land here too.
    location ^~ /.well-known/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny access to dot files
    location ~ /\. {
        deny all;
    }

    # Deny access to env file
    location ~ /\.env {
        deny all;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri /index.php?$query_string;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket support for Reverb.
    #
    # Do not reserve /app here: Laravel uses /app/{project} for clean
    # project previews. If Reverb is exposed through this Nginx instance,
    # configure the frontend/server to use /reverb instead.
    location /reverb {
        proxy_pass http://127.0.0.1:8892;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript text/xml application/xml application/xml+rss;
    gzip_min_length 1024;
}
